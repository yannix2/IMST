# Deploys the three Workers to Cloudflare, in the order their bindings need:
#   maarif-cms (D1 + R2)  ->  maarif-api (service bindings to the CMS and the site)  ->  maarif-web
# Builds run here on Linux (OpenNext needs symlinks, which Windows blocks without Developer Mode).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   required. Account: Workers Scripts Edit, Workers R2 Storage Edit, D1 Edit,
#                          Account Settings Read, Cloudflare Images Edit, Email Routing Addresses Read.
#                          Zone yassinekhiari.download: Workers Routes Edit, DNS Edit, Zone Read.
#   PAYLOAD_SECRET         required. A long random string (openssl rand -hex 32). Never change it
#                          afterwards: it signs logins and API keys.
#   REVALIDATE_SECRET      optional (wave 3). Random string shared by the three Workers: maarifcms
#                          tells maarif-api, which tells maarif-web, which pages to refresh.
#   MAINTENANCE_SECRET     optional (wave 3). Random string shared by maarif-api (nightly cron) and
#                          maarifcms (retention and backup).
#                          Both were set straight on the Workers on 2026-11-09 (wrangler secret put);
#                          a Worker keeps its secrets across deploys. Add them here only to rotate them
#                          (then the workflow writes the same value to every Worker).
#   CMS_API_KEY            optional on the first run. The API key of the "api-clients" document the
#                          API uses to read the CMS (create it in the admin after the first deploy,
#                          add the secret, run the workflow again).
#   TURNSTILE_SECRET       required once the repository variable LAUNCHED is "true". Before launch,
#                          Cloudflare's always-pass test key is used (demo only).
# Repository variable: LAUNCHED = "true" on the school's own domain (blocks demo settings).
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 2a1872156e1ff059f5ed2d0adf2bcaea
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  HAS_REVALIDATE: ${{ secrets.REVALIDATE_SECRET != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check the secrets
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          LAUNCHED: ${{ vars.LAUNCHED }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN PAYLOAD_SECRET; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ "$LAUNCHED" = "true" ] && [ -z "$TURNSTILE_SECRET" ]; then missing="$missing TURNSTILE_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error::Add the repository secrets:$missing, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        env:
          PAYLOAD_SECRET: ci-only-test-secret
        run: |
          pnpm typecheck
          pnpm --filter @maarif/contracts test
          pnpm --filter @maarif/api test
          pnpm --filter @maarif/media-tools test
          pnpm --filter @maarif/cms test:int

      # ---- maarif-cms -----------------------------------------------------------------------
      - name: CMS - migrate the database
        working-directory: apps/cms
        run: NODE_ENV=production PAYLOAD_SECRET=ignore pnpm payload migrate
      - name: CMS - build and deploy
        working-directory: apps/cms
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
      - name: CMS - secrets
        working-directory: apps/cms
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          printf '%s' "$PAYLOAD_SECRET" | pnpm exec wrangler secret put PAYLOAD_SECRET
          if [ -n "$REVALIDATE_SECRET" ]; then printf '%s' "$REVALIDATE_SECRET" | pnpm exec wrangler secret put REVALIDATE_SECRET; fi
          if [ -n "$MAINTENANCE_SECRET" ]; then printf '%s' "$MAINTENANCE_SECRET" | pnpm exec wrangler secret put MAINTENANCE_SECRET; fi

      # ---- maarif-api -----------------------------------------------------------------------
      - name: API - deploy
        working-directory: apps/api
        run: pnpm exec wrangler deploy
      - name: API - secrets
        working-directory: apps/api
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          printf '%s' "${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}" | pnpm exec wrangler secret put TURNSTILE_SECRET
          if [ -n "$REVALIDATE_SECRET" ]; then printf '%s' "$REVALIDATE_SECRET" | pnpm exec wrangler secret put REVALIDATE_SECRET; fi
          if [ -n "$MAINTENANCE_SECRET" ]; then printf '%s' "$MAINTENANCE_SECRET" | pnpm exec wrangler secret put MAINTENANCE_SECRET; fi
          if [ -n "$CMS_API_KEY" ]; then
            printf '%s' "$CMS_API_KEY" | pnpm exec wrangler secret put CMS_API_KEY
          else
            echo "::warning::CMS_API_KEY is not set yet: the site's CMS sections stay hidden and forms cannot be stored."
          fi

      # ---- maarif-web -----------------------------------------------------------------------
      # Page cache for refresh on publish (ADR 007): bucket maarif-next-cache and database
      # maarif-next-tags were created once (2026-11-09) and are named in apps/web/wrangler.jsonc.
      - name: Site - build and deploy
        working-directory: apps/web
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
      - name: Site - secret
        working-directory: apps/web
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: if [ -n "$REVALIDATE_SECRET" ]; then printf '%s' "$REVALIDATE_SECRET" | pnpm exec wrangler secret put REVALIDATE_SECRET; fi
      # Pages were built before the CMS could be read here: refresh them all once (needs the
      # secret here; without it, pages refresh by themselves within five minutes).
      - name: Site - refresh every page from maarifcms
        if: ${{ env.HAS_REVALIDATE == 'true' }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST "https://yassinekhiari.download/revalidate" \
            -H "content-type: application/json" -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            -d '{"tags":["cms"]}' || echo "::warning::Refresh call failed; pages refresh by themselves within five minutes."
