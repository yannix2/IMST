# Deploys the three Workers to Cloudflare, in the order their bindings need:
#   maarif-cms (D1 + R2)  ->  maarif-api (service binding to the CMS)  ->  maarif-web (service binding to the API)
# Builds run here on Linux (OpenNext needs symlinks, which Windows blocks without Developer Mode).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   required. Account: Workers Scripts Edit, Workers R2 Storage Edit, D1 Edit,
#                          Account Settings Read. Zone yassinekhiari.download: Workers Routes Edit,
#                          DNS Edit, Zone Read.
#   PAYLOAD_SECRET         required. A long random string (openssl rand -hex 32). Never change it
#                          afterwards: it signs logins and API keys.
#   CMS_API_KEY            optional on the first run. The API key of the "api-clients" document the
#                          API uses to read the CMS (create it in the admin after the first deploy,
#                          add the secret, run the workflow again).
#   TURNSTILE_SECRET       optional. Without it, Cloudflare's always-pass test key is used (demo only).
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 2a1872156e1ff059f5ed2d0adf2bcaea
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check the secrets
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$PAYLOAD_SECRET" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and PAYLOAD_SECRET, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm --filter @maarif/contracts test
          pnpm --filter @maarif/api test

      # ---- maarif-cms -----------------------------------------------------------------------
      - name: CMS - migrate the database
        working-directory: apps/cms
        run: NODE_ENV=production PAYLOAD_SECRET=ignore pnpm payload migrate
      - name: CMS - build and deploy
        working-directory: apps/cms
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
      - name: CMS - secret
        working-directory: apps/cms
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: printf '%s' "$PAYLOAD_SECRET" | pnpm exec wrangler secret put PAYLOAD_SECRET

      # ---- maarif-api -----------------------------------------------------------------------
      - name: API - deploy
        working-directory: apps/api
        run: pnpm exec wrangler deploy
      - name: API - secrets
        working-directory: apps/api
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
        run: |
          printf '%s' "${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}" | pnpm exec wrangler secret put TURNSTILE_SECRET
          if [ -n "$CMS_API_KEY" ]; then
            printf '%s' "$CMS_API_KEY" | pnpm exec wrangler secret put CMS_API_KEY
          else
            echo "::warning::CMS_API_KEY is not set yet: the site's CMS sections stay hidden and forms cannot be stored."
          fi

      # ---- maarif-web -----------------------------------------------------------------------
      - name: Site - build and deploy
        working-directory: apps/web
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
